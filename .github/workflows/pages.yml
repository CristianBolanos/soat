name: GitHub Pages

# Publica el sitio en https://cristianbolanos.github.io/soat/ (bajo /soat). Cloudflare Pages
# publica el mismo repositorio en la raíz de soatya.pages.dev, sin esta variable.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_BASE: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build con la base del repositorio
        run: pnpm build

      - name: Comprobar que todas las rutas llevan la base
        run: pnpm exec vitest run --project build tests/build/base-path.test.ts

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
