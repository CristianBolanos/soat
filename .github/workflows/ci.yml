name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Auditoría de dependencias de producción
        run: pnpm audit --prod --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Tipos (astro check)
        run: pnpm check

      - name: Pruebas unitarias
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pruebas de integración sobre dist/
        run: pnpm test:build

      - name: Validación HTML (html-validate + Nu HTML Checker)
        run: pnpm validate:html

      - name: Navegadores de Playwright
        run: pnpm exec playwright install --with-deps

      - name: Pruebas E2E y de accesibilidad
        run: pnpm test:e2e

      - name: Lighthouse CI
        run: pnpm lhci

      - name: Reportes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 7
